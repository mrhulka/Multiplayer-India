</head><body class="phone"><main id="app"></main><script>
const $ = q => document.querySelector(q), app = $('#app');
const html = h => { app.innerHTML = h; scrollTo(0, 0); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
// API call with retries on network trouble; always resolves ({ error: 'offline' } when it gives up)
async function post(p, b, tries = 3) {
  for (let i = 0; ; i++) {
    try { return await (await fetch('/api/' + p, { method: 'POST', body: JSON.stringify(b) })).json(); }
    catch { if (i >= tries - 1) return { error: 'offline' }; await new Promise(z => setTimeout(z, 400 * (i + 1))); }
  }
}
const toast = msg => { $('.toast')?.remove(); const t = Object.assign(document.createElement('div'), { className: 'toast', role: 'status', textContent: msg }); document.body.append(t); setTimeout(() => t.remove(), 3200); };
const fmt = n => Math.abs(n) >= 10000 ? n.toLocaleString('en-IN') : String(n);
const ico = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const LOCK = '<svg class="lockmark" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.6"/></svg>';
const LOGO = `<span class="logo"><span class="lockbox">${LOCK}</span>Lock It</span>`;
// one flat sticker per game
const GLYPH = { map: '<svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z" fill="#FBF8F3" stroke="#1C1A24" stroke-width="1.2" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.6" fill="#1C1A24"/></svg>',
  num: '<span class="gl-num" aria-hidden="true">1983?</span>',
  face: '<svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8l-5 4v-4H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="#FBF8F3" stroke="#1C1A24" stroke-width="1.1" stroke-linejoin="round"/><path d="M10 9.2a2 2 0 1 1 2.8 1.8c-.6.3-.8.7-.8 1.3" fill="none" stroke="#1C1A24" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="14.2" r=".8" fill="#1C1A24"/></svg>',
  dahi: '<svg class="gl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c0-1.5 1.5-2 2.5-1s.5 3.5-2 3.5-4-2-3.5-4.5S12.5 6 15 6.5s4.5 3 4 6-3.5 6-7.5 5.5S5 14.5 5.5 11 9 4.5 12 4.5" fill="none" stroke="#1C1A24" stroke-width="1.6" stroke-linecap="round"/></svg>' };
const ARROW = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const CHECK = ico('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
const GAMES = { map: { name: 'AtaaPataa', blurb: 'Drop a pin on the map of India. Closest pin wins, or gamble on a tight circle.' },
                num: { name: 'Andaaza Apna Apna', blurb: 'Guess the number. Closest wins, bang on earns +200.' },
                face: { name: 'Pehchaan Kaun', blurb: 'One little-known fact. Type the Bollywood star’s name. Perfect spelling scores most.' },
                dahi: { name: 'Dimaag Ka Dahi', blurb: 'Twisted rishte, sneaky maths, trick questions. Four options, all of them tempting.' } };
const LETTERS = 'ABCD';
const ROUND_OPTS = [3, 5, 8, 10, 15, 20];
const savedRounds = g => { try { return +localStorage['dpg-rounds-' + g] || 8; } catch { return 8; } };

// remembered on this device between visits: { name, device, room?, token?, id?, secret? }
const store = { get() { try { return JSON.parse(localStorage.lockit || sessionStorage.dpg || '{}'); } catch { return {}; } }, set(v) { try { localStorage.lockit = JSON.stringify(v); } catch {} } };
let me = store.get(), S, key, tick, es, guess, maps = [], skew = 0, lastSeen = 0; // skew = server clock - this device's clock
me.device ||= crypto.randomUUID?.() || String(Math.random()).slice(2) + Date.now(); // lets a rejoin find your seat again
const fresh = () => ({ name: me.name, device: me.device });
const linkRoom = new URLSearchParams(location.search).get('room')?.toUpperCase();
if (linkRoom && me.room !== linkRoom) me = fresh();
const save = () => store.set(me);
const isHost = () => !!me.token, isTv = () => isHost() && S?.play === 'tv', online = () => S?.play === 'online';
// Esri basemaps: free, no API key. ponytail: switch to a keyed provider if usage outgrows Esri's free terms
const tiles = name => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${name}/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16, attribution: 'Tiles © Esri' });
// India's states (official boundaries), bundled with the game. Guessing map: states only, no base map, no labels.
let statesP; const states = () => statesP ||= fetch('/india-states.json').then(r => r.json());
const addStates = (m, fill) => states().then(S => L.polygon(S.flat().map(ring => [ring]), { color: '#A39C8E', weight: 1, fill, fillColor: '#FFFFFF', fillOpacity: 1, interactive: false, renderer: L.canvas() }).addTo(m)); // one canvas layer: far cheaper than 400 SVG paths
const PIN_SVG = c => `<svg viewBox="0 0 24 32" width="30" height="40" aria-hidden="true"><path d="M12 31s10-11 10-19A10 10 0 0 0 2 12c0 8 10 19 10 19z" fill="${c}" stroke="#1C1A24" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="#1C1A24"/></svg>`;
const pinIcon = (c = '#FF8A3D') => L.divIcon({ className: 'pin', html: PIN_SVG(c), iconSize: [30, 40], iconAnchor: [15, 39], tooltipAnchor: [0, -32] });
const buzz = ms => navigator.vibrate?.(ms);
const INDIA = [[6.5, 68.1], [35.6, 97.4]];
const joinUrl = code => `${location.origin}/?room=${code}`;

// ---------- entry: name first, then create or join ----------
const STICKERS = `<div class="stickers" aria-hidden="true">${['map', 'num', 'face', 'dahi'].map(g => `<div class="stk g-${g}">${GLYPH[g]}</div>`).join('')}<span class="tag t1">${CHECK}Locked in!</span><span class="tag t2">+1000</span></div>`;
const heroCopy = inner => `<section class="hero"><div class="stack hero-copy rise"><span class="eyebrow">4 games · no app · just phones</span>
  <h1 class="display-xl">Phones out.<br>Game on.</h1><p class="lede">Game night with your friends, wherever they are. Everyone answers on their phone. Fastest and closest wins.</p>${inner}</div>${STICKERS}</section>`;
function nameScreen() {
  document.body.className = 'web';
  html(`<header class="site-head rise">${LOGO}</header>` + heroCopy(`<form id="f" class="stack namebox"><label for="n">First things first. What should we call you?</label>
    <div class="inline"><input id="n" maxlength="16" autocomplete="nickname" placeholder="Your name" value="${esc(me.name)}" required><button>Let’s go</button></div></form>`));
  if (!coarse()) $('#n').focus();
  $('#f').onsubmit = e => { e.preventDefault(); me.name = $('#n').value.trim(); if (!me.name) return; save(); linkRoom ? join(linkRoom) : home(); };
}
function home(msg = '') {
  document.body.className = 'web';
  const steps = [['map', 'Open it on a big screen', 'A laptop or TV in the room, or just send the link.'], ['num', 'Friends join on their phones', 'Scan the QR or open the link. Type a name and they’re in.'], ['dahi', 'Lock it in', '25 seconds a question. Answers and points show on every screen.']];
  html(`<header class="site-head rise">${LOGO}<nav><a href="#games">Games</a><a href="#how">How it works</a><button class="who" id="rename"><span class="av">${esc(me.name[0].toUpperCase())}</span>${esc(me.name)}</button></nav></header>`
    + heroCopy(`${msg ? `<p class="card">${esc(msg)}</p>` : ''}<div class="modes">
      <button class="mode" data-play="tv"><b>Same room ${ARROW}</b><small>This screen hosts, phones scan a QR</small></button>
      <button class="mode ghost" data-play="online"><b>Play online ${ARROW}</b><small>Share a link, friends join from anywhere</small></button></div>
      <form id="j" class="codebox"><label for="c">Got a room code?</label><input id="c" class="code" maxlength="4" autocomplete="off" placeholder="ABCD" required><button>Join</button><p id="err" class="accent" role="alert"></p></form>`)
    + `<section id="games" class="band"><div class="section"><div class="section-head"><h2>Pick your poison</h2><p>3 to 20 rounds a game. Questions don’t repeat for weeks.</p></div>
      <div class="showcase">${Object.entries(GAMES).map(([g, x]) => `<article class="show g-${g}"><div class="top">${GLYPH[g]}</div><div class="txt"><h3>${x.name}</h3><p>${x.blurb}</p></div></article>`).join('')}</div></div></section>
    <section id="how" class="section pad"><div class="section-head"><h2>Three steps, zero setup</h2></div>
      <ol class="steps">${steps.map(([g, t, d], i) => `<li class="g-${g}"><span class="n">${i + 1}</span><div><b>${t}</b><span class="txt">${d}</span></div></li>`).join('')}</ol></section>
    <footer class="site-foot"><span class="muted">Lock It · ${esc(location.host)}</span>${shareBar(location.origin, 'Game night with your friends, wherever they are. Play Lock It:')}</footer>`);
  $('#rename').onclick = nameScreen;
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => create(b.dataset.play));
  $('#j').onsubmit = e => { e.preventDefault(); join($('#c').value.trim().toUpperCase()); };
}
async function create(play) {
  const r = await post('room', { play, name: me.name, device: me.device });
  if (r.error) return toast('Couldn’t start a room. Check your connection and try again.');
  me = { ...fresh(), room: r.code, token: r.token, id: r.id, secret: r.secret }; save(); connect();
}
async function join(code) {
  const r = await post('join', { room: code, name: me.name, device: me.device });
  if (r.error) { const err = r.error === 'no room' ? `Couldn’t find room ${code}. Check the code?` : r.error === 'offline' ? 'No connection. Try again.' : r.error; return $('#err') ? $('#err').textContent = err : home(err); }
  me = { ...fresh(), room: code, id: r.id, secret: r.secret }; save(); history.replaceState(null, '', '/?room=' + code); connect();
}
function connect(quiet) {
  es?.close(); es = new EventSource(`/api/events?room=${me.room}${me.id ? '&id=' + me.id : ''}`); states(); // fetch the India map now, not when the first map round starts
  lastSeen = Date.now();
  es.onmessage = e => { lastSeen = Date.now(); render(JSON.parse(e.data)); };
  es.addEventListener('ping', () => lastSeen = Date.now());
  es.onerror = () => { if (es.readyState === 2) { const was = S; me = fresh(); save(); es = null; history.replaceState(null, '', '/'); home(quiet && !was ? '' : 'That room has ended. Start a new one?'); } };
}
// a phone that slept or switched apps can hold a dead connection without noticing: reconnect when the heartbeat stops
setInterval(() => { if (es && Date.now() - lastSeen > 25000) connect(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && es && Date.now() - lastSeen > 4000) connect(); });
const coarse = () => matchMedia('(pointer: coarse)').matches; // touch screens: don't pop the keyboard up uninvited

// ---------- game screens ----------
function render(s) {
  S = s; if (s.now) skew = s.now - Date.now(); // countdowns follow the server's clock, not this device's
  if (s.next) new Image().src = s.next; // preload the next question's photo during the results screen
  document.body.className = isTv() ? 'tv' : isHost() && s.phase === 'lobby' ? 'wide' : 'phone';
  const k = [s.phase, s.round, s.game].join();
  if (k !== key) { key = k; guess = null; clearInterval(tick); maps.forEach(m => m.remove()); maps = []; draw(s); }
  syncChips($('#pills'), s.players, s.phase === 'question');
  document.querySelectorAll('[data-game]').forEach(b => b.disabled = !s.players.length);
  const c = $('#count'); if (c) c.textContent = s.phase === 'question' ? `${s.players.filter(p => p.answered).length} / ${s.players.length}` : `${s.players.length} joined`;
}
// add/remove chips in place so only new ones animate
function syncChips(el, players, showDone) {
  if (!el) return;
  const have = new Map([...el.children].map(c => [c.dataset.id, c]));
  for (const p of players) {
    let c = have.get(p.id);
    if (!c) { c = Object.assign(document.createElement('span'), { className: 'chip', textContent: p.name }); c.dataset.id = p.id; c.dataset.i = (p.name[0] || '?').toUpperCase(); el.append(c); }
    have.delete(p.id); c.classList.toggle('done', showDone && p.answered); c.classList.toggle('wait', showDone && !p.answered);
  }
  have.forEach(c => c.remove());
}
const mine = () => S.players.find(p => p.id === me.id);
const lobbyBtn = () => isHost() ? '<button class="small ghost corner" id="lobby">Back to lobby</button>' : '';
const lobbyInline = () => isHost() ? '<button class="small ghost" id="lobby">Back to lobby</button>' : '';
const gname = s => `<span class="gname g-${s.game}"><span class="mini">${GLYPH[s.game]}</span>${GAMES[s.game].name}</span>`;
const gameCards = () => `<div class="games">${Object.entries(GAMES).map(([g, x], i) => `<div class="game g-${g} rise" style="--d:${.1 + i * .06}s"><div class="game-head"><h2>${x.name}</h2><span class="glyph">${GLYPH[g]}</span></div><p class="blurb">${x.blurb}</p>
  <div class="go-row"><button class="go" data-game="${g}" ${S.players.length ? '' : 'disabled'}>Start</button><label class="rounds"><select data-rounds="${g}" aria-label="Rounds for ${x.name}">${ROUND_OPTS.map(n => `<option value="${n}"${n === savedRounds(g) ? ' selected' : ''}>${n} rounds</option>`).join('')}</select></label></div></div>`).join('')}</div>`;
const pills = (cls = '') => `<div class="chips ${cls}" id="pills"></div>`;
// share to any platform: links for the big ones, the phone's own share sheet for everything else, and copy
function shareBar(url, text) {
  const u = encodeURIComponent(url), t = encodeURIComponent(text), both = encodeURIComponent(`${text} ${url}`);
  const links = [['wa', 'WhatsApp', `https://wa.me/?text=${both}`], ['tg', 'Telegram', `https://t.me/share/url?url=${u}&text=${t}`], ['x', 'X', `https://twitter.com/intent/tweet?text=${t}&url=${u}`],
    ['fb', 'Facebook', `https://www.facebook.com/sharer/sharer.php?u=${u}`], ['mail', 'Email', `mailto:?subject=${encodeURIComponent('Play Lock It with me')}&body=${both}`], ['sms', 'SMS', `sms:?&body=${both}`]];
  return `<div class="sharebar">${links.map(([c, n, h]) => `<a class="sh ${c}" href="${esc(h)}" target="_blank" rel="noopener">${n}</a>`).join('')}
    <button type="button" class="sh copy" data-copy="${esc(url)}">Copy link</button>${navigator.share ? `<button type="button" class="sh more" data-share="${esc(url)}" data-text="${esc(text)}">More…</button>` : ''}</div>`;
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'), m = e.target.closest('[data-share]');
  if (c) { navigator.clipboard?.writeText(c.dataset.copy).then(() => toast('Link copied'), () => toast(c.dataset.copy)); }
  if (m) navigator.share({ title: 'Lock It', text: m.dataset.text, url: m.dataset.share }).catch(() => {});
});

function draw(s) {
  app.classList.toggle('fit', !isTv() && s.phase === 'question' && (s.game === 'map' || s.game === 'dahi')); // map / option rounds: exactly one screen
  ({ lobby, question, reveal, final })[s.phase](s);
  $('#lobby') && ($('#lobby').onclick = () => post('lobby', { room: me.room, token: me.token }));
  document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => { const g = b.dataset.game, rounds = +$(`[data-rounds="${g}"]`).value;
    try { localStorage['dpg-rounds-' + g] = rounds; } catch {} post('start', { room: me.room, token: me.token, game: g, rounds }); });
  countUp();
}

function lobby(s) {
  const players = `<aside class="card stack players rise" style="--d:.1s"><div class="row"><h2>Players</h2><span class="muted" id="count"></span></div>${pills('list')}<p class="muted">New players pop in here the moment they join.</p></aside>`;
  const picker = `<div class="stack picker"><div class="row rise" style="--d:.05s"><h1 class="h-sec">Pick a game</h1><span class="muted">Set the rounds, then hit Start</span></div>${gameCards()}</div>`;
  if (isTv()) {
    html(`<header class="site-head rise">${LOGO}<span class="muted">Hosted by ${esc(s.host || me.name)} · Same room</span></header>
      <div class="lobby"><aside class="card stack join rise"><span class="label">Join on your phone</span><div class="qr" id="qr"></div>
        <p class="muted">or open <b style="color:var(--ink)">${esc(location.host)}</b> and type</p>
        <div class="tiles">${[...s.code].map((ch, i) => `<span class="pop" style="--d:${.1 + i * .08}s">${ch}</span>`).join('')}</div>
        <div class="far"><span class="label">Someone not in the room? Send the link</span>${shareBar(joinUrl(s.code), `Join my Lock It game! Room ${s.code}:`)}</div></aside>${picker}${players}</div>`);
    new QRCode($('#qr'), { text: joinUrl(s.code), width: 212, height: 212, colorDark: '#1C1A24', colorLight: '#FFFFFF' });
  } else if (isHost()) { // online host
    html(`<header class="site-head rise">${LOGO}<span class="pill">Room ${s.code}</span></header>
      <div class="lobby"><aside class="card stack join invite rise"><h2>Invite your friends</h2><p class="muted">Send the link on any app. They can join from anywhere.</p>
        <input id="link" readonly value="${esc(joinUrl(s.code))}" aria-label="Invite link" onfocus="this.select()">${shareBar(joinUrl(s.code), `${me.name} invited you to play Lock It! Room ${s.code}:`)}</aside>${picker}${players}</div>`);
  } else {
    html(`<div class="stack rise" style="margin-top:6vh;align-items:center;text-align:center"><div class="check">${CHECK}</div>
      <h1>You’re in, ${esc(mine()?.name || me.name)}!</h1><p class="muted">Waiting for ${esc(s.host || 'the host')} to pick a game…</p></div>
      <div class="row rise" style="--d:.1s"><span class="label">Players</span><span class="muted" id="count"></span></div>${pills()}
      <div class="card stack rise" style="--d:.15s"><span class="label">Bring more friends</span>${shareBar(joinUrl(s.code), `Join our Lock It game! Room ${s.code}:`)}</div>`);
  }
}

const left = s => Math.max(0, (s.endsAt - (Date.now() + skew)) / 1000);
function timer(s) {
  const t = () => { const l = Math.ceil(left(s)); $('#t') && ($('#t').textContent = l); document.querySelectorAll('.clock, .drain').forEach(e => e.classList.toggle('low', l <= 5)); };
  t(); tick = setInterval(t, 250);
}
const anim = s => `animation-duration:${s.secs}s;animation-delay:${-(s.secs - left(s))}s`;
const dots = s => `<div class="dots" aria-label="Round ${s.round} of ${s.total}">${Array.from({ length: s.total }, (_, i) => `<i class="${i < s.round - 1 ? 'past' : i === s.round - 1 ? 'now' : ''}"></i>`).join('')}</div>`;
const howTo = s => s.game === 'dahi' ? 'Pick one · faster right answers score more' : s.game === 'face' ? 'Type the name · exact spelling scores most' : s.game === 'num' ? 'Type your andaaza' : s.mode === 'circle' ? 'Circle round · smaller circle, more points' : 'Pin round · closest wins';
const optTiles = s => `<div class="opts">${s.options.map((o, i) => `<div class="opt o${i}"><b>${LETTERS[i]}</b><span>${esc(o)}</span></div>`).join('')}</div>`;
function promptBlock(s) {
  if (s.game === 'dahi') return `<div class="card prompt clue panel g-dahi rise"><span class="label">Dimaag Ka Dahi</span><h2>${esc(s.prompt)}</h2></div>`;
  if (s.game === 'face') return `<div class="card prompt clue panel g-face rise"><span class="label">Pehchaan kaun?</span><h2>${esc(s.prompt)}</h2></div>`;
  if (s.game === 'num') return `<div class="card prompt panel g-num rise"><span class="label">Type a number on your phone</span><h2>${esc(s.prompt)}${s.unit ? ` <span class="label">(${esc(s.unit)})</span>` : ''}</h2></div>`;
  const q = s.photoOnly ? 'Where is this?' : `Where is ${esc(s.prompt)}?`;
  return s.img ? `<div class="photo"><img src="${esc(s.img)}" alt=""><h2>${q}</h2></div>` : `<div class="card prompt panel g-map rise"><h2>${q}</h2></div>`;
}
// photo failed to load: turn the photo box into a plain question card (and name the place on photo-only rounds)
const photoFallback = s => { const im = $('.photo img'); if (im) im.onerror = () => { const ph = $('.photo'); im.remove(); ph.className = 'card prompt panel g-map'; ph.querySelector('h2').textContent = `Where is ${s.prompt}?`; }; };

function question(s) {
  if (isTv()) {
    html(`<div class="topbar g-${s.game} rise">${gname(s)}${dots(s)}<span class="pill">${howTo(s)}</span><span class="clock"><b id="t"></b><small>sec</small></span>${lobbyInline()}</div><div class="drain"><i style="${anim(s)}"></i></div>
      <div class="ask">${s.game === 'dahi' ? `<div class="stack">${promptBlock(s)}${optTiles(s)}</div>` : promptBlock(s)}<aside class="card stack rise" style="--d:.1s"><div class="row"><h2>Locked in</h2><h2 id="count"></h2></div>${pills('list')}<p class="muted">The answer shows the moment everyone locks in.</p></aside></div>`);
    photoFallback(s); return timer(s);
  }
  if (mine()?.answered) return lockedView(); // already answered this round (refreshed / reconnected)
  // phone: online players also need the prompt, same-room players look at the host screen
  const ask = online() ? promptBlock(s) : `<h1 class="rise" style="font-size:28px">${s.game === 'dahi' ? 'Read the puzzle on the host screen' : s.game === 'face' ? 'Pehchaan kaun? Read the clue on the host screen' : s.game === 'num' ? esc(s.prompt) : s.photoOnly ? 'Where’s the place on the host screen?' : `Where is ${esc(s.prompt)}?`}</h1>`;
  const short = s.game === 'dahi' ? 'Dimaag Ka Dahi' : s.game === 'face' ? 'Pehchaan Kaun' : s.game === 'num' ? 'Andaaza' : s.mode === 'circle' ? 'Circle round' : 'Pin round';
  const top = `<div class="qbar"><span class="label">Round ${s.round}/${s.total} · ${short}</span><span style="display:flex;gap:8px;align-items:center;flex-shrink:0">${isHost() ? '<button class="small ghost" id="lobby">Lobby</button>' : ''}<b id="t" class="secs" aria-label="seconds left"></b></span></div><div class="drain"><i style="${anim(s)}"></i></div>${ask}`;
  if (s.game === 'dahi') {
    html(`${top}<div class="opts pick">${s.options.map((o, i) => `<button class="opt o${i}" data-pick="${i}"><b>${LETTERS[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>`);
    document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { guess = +b.dataset.pick; b.classList.add('chosen'); submit(); });
  } else if (s.game === 'face') {
    html(`${top}<form id="f" class="stack rise" style="--d:.1s"><input id="g" type="text" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="words" enterkeyhint="send" maxlength="60" placeholder="Who is it?" aria-label="Celebrity name" required><button>Lock it in</button></form>`);
    if (!coarse()) $('#g').focus();
    $('#f').onsubmit = e => { e.preventDefault(); guess = $('#g').value.trim(); if (guess) submit(); };
  } else if (s.game === 'num') {
    html(`${top}<form id="f" class="stack rise" style="--d:.1s"><input id="g" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="send" placeholder="Your andaaza${s.unit ? ' (' + esc(s.unit) + ')' : ''}" aria-label="Your answer" required><button>Lock it in</button></form>`);
    if (!coarse()) $('#g').focus();
    // "1,983", "₹ 450", " 7 " all count; commas and spaces are ignored
    $('#f').onsubmit = e => { e.preventDefault(); const v = $('#g').value.replace(/[^\d.\-]/g, ''); guess = v === '' ? null : parseFloat(v); submit(); };
  } else {
    const circle = s.mode === 'circle';
    html(`${top}<div id="m" class="map rise" style="--d:.08s"></div>
      ${circle ? `<div class="card slider"><label for="r" class="row"><span>Circle · <span id="rl">300</span> km</span><span class="accent" id="rp">up to 700 pts</span></label><input id="r" type="range" min="25" max="1000" step="25" value="300"></div>` : ''}
      <button id="s" disabled>${circle ? 'Tap the map, then lock it in' : 'Tap the map to drop your pin'}</button>`);
    photoFallback(s);
    const m = L.map('m', { zoomControl: false, attributionControl: true, zoomSnap: .25 }).fitBounds(INDIA, { padding: [6, 6] }); maps.push(m);
    addStates(m, true); m.attributionControl.addAttribution('Boundaries: india-maps-data');
    let pin, ring;
    const upd = () => { if (!pin) return; guess = { ...pin.getLatLng(), radius: circle ? +$('#r').value : undefined };
      if (circle) { ring ? ring.setLatLng(guess).setRadius(guess.radius * 1000) : (ring = L.circle(guess, { radius: guess.radius * 1000, color: '#FF8A3D', weight: 3, fillOpacity: .2 }).addTo(m)); }
      $('#s').disabled = false; $('#s').textContent = 'Lock it in'; };
    m.on('click', e => { pin ? pin.setLatLng(e.latlng) : (pin = L.marker(e.latlng, { icon: pinIcon() }).addTo(m)); buzz(15); upd(); });
    if (circle) $('#r').oninput = () => { const v = +$('#r').value; $('#rl').textContent = v; $('#rp').textContent = `up to ${Math.max(100, 1000 - v)} pts`; upd(); };
    $('#s').onclick = submit;
  }
  timer(s);
}
async function submit() {
  if (guess == null || guess === '' || Number.isNaN(guess)) return toast(S.game === 'num' ? 'Type a number first' : S.game === 'map' ? 'Tap the map to drop your pin' : 'Type a name first');
  const k = key, btns = [...document.querySelectorAll('#s, #f button, [data-pick]')], label = $('#s, #f button');
  btns.forEach(b => b.disabled = true); if (label) label.textContent = 'Locking in…';
  const r = await post('answer', { room: me.room, id: me.id, secret: me.secret, guess }, 4);
  if (key !== k) return; // the reveal arrived before our own reply: don't cover it
  if (r.error) { // say what happened and let them try again
    btns.forEach(b => { b.disabled = false; b.classList.remove('chosen'); }); if (label) label.textContent = 'Lock it in';
    return toast(r.error === 'not now' ? 'Time’s up for this round' : r.error === 'offline' ? 'No connection. Tap Lock it in again.' : 'That didn’t go through. Try again.');
  }
  lockedView();
}
function lockedView() {
  clearInterval(tick); maps.forEach(m => m.remove()); maps = []; buzz(40); app.classList.remove('fit');
  html(`${lobbyBtn()}<div class="locked"><div class="check">${CHECK}</div><h1>Locked in!</h1>
    <p class="muted">${online() ? 'Waiting for the others…' : 'Eyes on the host screen.'}</p></div>${online() ? `<div class="row"><span class="label">Answered</span><span class="muted" id="count"></span></div>${pills()}` : ''}`);
  syncChips($('#pills'), S.players, true);
}

function reveal(s) {
  const r = s.reveal, map = s.game === 'map', face = s.game === 'face', dahi = s.game === 'dahi', you = r.results.find(x => x.id === me.id);
  // host screen keeps pace with the phones: everything is in place within about half a second
  const head = dahi ? `<div class="card prompt clue rise"><h2>${esc(s.prompt)}</h2></div>`
    : face ? `<p class="muted center rise">Pehchaan kaun?</p><h1 class="big slam">${esc(r.name)}</h1>`
    : map ? `<h1 class="big slam">${esc(r.name)}</h1>` : `<p class="muted center rise">${esc(s.prompt)}</p><div class="answer slam">${fmt(r.answer)}${r.unit ? `<small> ${esc(r.unit)}</small>` : ''}</div>`;
  const fact = r.fact ? `<div class="card fact rise" style="--d:.2s">${r.img && !face ? `<img src="${esc(r.img)}" alt="" onerror="this.remove()">` : ''}<p><span class="label">${face ? 'The clue' : dahi ? 'Kyunki…' : 'Did you know?'}</span><br>${esc(r.fact)}</p></div>` : '';
  const detail = x => dahi ? (x.exact ? `right in ${(x.ms / 1000).toFixed(1)}s` : `picked “${x.guess}”`) : face ? (x.exact ? 'spelled perfectly' : `typed “${x.guess}”`) : map ? `${fmt(x.err)} km off${x.guess.radius ? ` · ${Math.round(x.guess.radius)} km circle` : ''}` : x.exact ? 'bang on! +200' : `off by ${fmt(x.err)}`;
  const cards = r.results.length ? `<div class="results">${r.results.map((x, i) => `<div class="res rise ${i === 0 && x.points ? 'best' : ''}" style="--d:${.25 + i * .05}s"><b>${esc(x.name)}</b><span class="pts" data-count="${x.points}" data-prefix="+">+0</span><small>${esc(detail(x))}</small></div>`).join('')}</div>` : '<p class="card center muted">Nobody answered!</p>';
  const board = dahi ? `<div class="opts">${r.options.map((o, i) => `<div class="opt o${i} ${i === r.right ? 'right' : 'wrong'} rise" style="--d:${.05 + i * .04}s"><b>${i === r.right ? '✓' : LETTERS[i]}</b><span>${esc(o)}<small>${esc(r.picks[i].join(', '))}</small></span></div>`).join('')}</div>` : '';
  const middle = map ? '<div id="m" class="map rise"></div>' : face ? '' : dahi ? board : scale(r), full = `${head}${middle}${fact}${cards}`;
  const bar = `<div class="topbar g-${s.game} rise">${gname(s)}<span class="muted">Round ${s.round} of ${s.total}</span><span class="clock"><small>Next question in a few seconds</small></span>${lobbyInline()}</div>`;
  if (isTv()) html(`${bar}<div class="split"><div class="card stack stage">${head}${middle}${fact}</div><aside class="stack scoreboard"><h2>This round</h2>${cards}</aside></div>`);
  else {
    const p = you?.points ?? 0, tot = mine()?.score ?? 0;
    const rank = [...S.players].sort((a, b) => b.score - a.score).findIndex(x => x.id === me.id) + 1;
    html(`${lobbyBtn()}<div class="result-panel g-${s.game}">
      <span class="label rise">${!you ? 'Too slow!' : dahi ? (you.exact ? 'Dimaag ka dahi nahi hua!' : `Dahi ho gaya! It was “${r.answer}”`) : face ? (you.exact ? 'Sahi jawab! Perfect spelling' : p ? `Close! It’s spelled ${r.name}` : `It was ${r.name}`) : you.exact ? 'Bang on!' : map && you.guess.radius ? (p ? 'Inside your circle!' : 'Missed your circle') : `${detail(you)}`}</span>
      <div class="points slam ${p ? '' : 'zero'}" style="--d:.15s" data-count="${p}" data-prefix="+">+0</div>
      <div class="row rise" style="--d:.35s;justify-content:center"><span class="pill">Total ${fmt(tot)}</span><span class="pill rank">#${rank} of ${S.players.length}</span></div></div>
      <div class="answer-chip rise" style="--d:.2s"><span class="label">The answer</span><b>${esc(map || face ? r.name : dahi ? r.answer : fmt(r.answer) + (r.unit ? ' ' + r.unit : ''))}</b></div>
      ${online() ? full : dahi ? board + fact : fact}`);
    if (you?.exact || (p && you === r.results[0])) confetti();
  }
  if (map && $('#m')) {
    const m = L.map('m'), pts = [[r.answer.lat, r.answer.lng]]; maps.push(m);
    tiles('World_Street_Map').addTo(m); addStates(m, false);
    L.circleMarker(pts[0], { radius: 12, color: '#1C1A24', weight: 3, fillColor: '#B9E86A', fillOpacity: 1 }).addTo(m).bindTooltip(esc(r.name), { permanent: true });
    r.results.forEach(x => { const p = [x.guess.lat, x.guess.lng]; pts.push(p);
      L.marker(p, { icon: pinIcon(x.points ? '#FF8A3D' : '#FF6FA8') }).addTo(m).bindTooltip(esc(x.name), { permanent: true, direction: 'top' }); L.polyline([pts[0], p], { color: '#1C1A24', dashArray: '6', weight: 2 }).addTo(m);
      if (x.guess.radius) L.circle(p, { radius: x.guess.radius * 1000, color: x.points ? '#2F7A12' : '#C2263B' }).addTo(m); });
    m.fitBounds(pts, { padding: [40, 40], maxZoom: 7 });
  }
}
// number line: answer as a teal beam, guesses alternating below/above
function scale(r) {
  const vals = [r.answer, ...r.results.map(x => x.guess)], lo = Math.min(...vals), hi = Math.max(...vals), pos = v => 5 + 90 * (v - lo) / (hi - lo || 1);
  return `<div class="scale"><div class="line"></div><div class="beam" style="left:${pos(r.answer)}%"></div>` +
    r.results.map((x, i) => `<div class="mark ${i % 2 ? 'up' : 'down'} ${x.exact ? 'hit' : ''}" style="left:${pos(x.guess)}%;--d:${.3 + i * .05}s"><i></i><b>${esc(x.name)}</b><span>${fmt(x.guess)}</span></div>`).join('') + '</div>';
}

function final(s) {
  const board = [...s.players].sort((a, b) => b.score - a.score), rank = board.findIndex(p => p.id === me.id) + 1;
  const list = `<div class="board">${board.map((p, i) => `<div class="rise" style="--d:${.15 + i * .06}s"><span class="n">${i + 1}</span><span>${esc(p.name)}</span><span data-count="${p.score}">0</span></div>`).join('')}</div>`;
  const again = (isHost() ? `<p class="center muted">Play again?</p>${gameCards()}` : `<p class="center muted">Waiting for ${esc(s.host || 'the host')}…</p>`)
    + `<div class="card stack"><span class="label">Had fun? Share Lock It</span>${shareBar(location.origin, 'We just played Lock It. Think you can beat us? Play here:')}</div>`;
  if (isTv()) html(`${lobbyBtn()}<h1 class="big slam">${esc(board[0]?.name || 'Nobody')} wins!</h1>${list}${again}`);
  else html(`${lobbyBtn()}<h1 class="big slam">${rank === 1 ? 'You win!' : '#' + rank}</h1><p class="center muted rise">${fmt(mine()?.score ?? 0)} points</p>${list}${again}`);
  if (isTv() || rank === 1) confetti();
}

function countUp() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, pre = el.dataset.prefix || '', delay = parseFloat(getComputedStyle(el.closest('[style*="--d"]') || el).getPropertyValue('--d')) || 0;
    const t0 = performance.now() + delay * 1000 + 100, step = t => { const k = Math.min(1, Math.max(0, (t - t0) / 600)); el.textContent = pre + fmt(Math.round(to * (1 - (1 - k) ** 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = Object.assign(document.createElement('div'), { className: 'confetti' });
  box.innerHTML = Array.from({ length: 40 }, () => `<i style="left:${Math.random() * 100}vw;background:${['#FF8A3D', '#4DA3FF', '#FF6FA8', '#B9E86A', '#1C1A24'][Math.random() * 5 | 0]}; animation-delay:${Math.random() * .8}s; animation-duration:${2 + Math.random() * 1.5}s"></i>`).join('');
  app.append(box); setTimeout(() => box.remove(), 4500);
}

// ---------- start ----------
save(); // keep the device id
if (!me.name) nameScreen(); else if (me.room) connect(true); else if (linkRoom) join(linkRoom); else home();
</script></body></html>
